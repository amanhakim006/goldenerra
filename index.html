<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>इमरान हाशमी - Golden 2000s Era</title>
    <!-- Google Fonts for stylish Hindi & English typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Poppins:wght@300;400;600&family=Rozha+One&family=Yatra+One&display=swap" rel="stylesheet">
    <!-- FontAwesome for Player Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Background image eh.png */
            background: #0d0d0d url('eh.png') no-repeat center center fixed;
            background-size: cover;
            position: relative;
            color: #ffffff;
            overflow-x: hidden;
            padding: 20px;
        }

        /* Subtle dark overlay for depth and text focus */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0, 0, 0, 0.45) 0%, rgba(10, 5, 20, 0.85) 100%);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 480px;
            background: rgba(18, 18, 26, 0.72);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 28px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), 0 0 25px rgba(255, 215, 0, 0.15);
        }

        /* Top Title & Branding Header */
        .header-title {
            font-family: 'Rozha One', 'Yatra One', serif;
            font-size: 2.2rem;
            background: linear-gradient(180deg, #fff3b0 0%, #ffd700 50%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 15px rgba(212, 175, 55, 0.35);
            margin-bottom: 4px;
            line-height: 1.2;
        }

        .subtitle {
            font-family: 'Cinzel', serif;
            font-size: 0.95rem;
            color: #e2d1b3;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 25px;
        }

        /* Middle Images Section */
        .images-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .img-top {
            width: 100%;
            max-width: 320px;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .img-bottom {
            width: 100%;
            max-width: 380px;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 215, 0, 0.2);
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .img-top:hover, .img-bottom:hover {
            transform: scale(1.02);
        }

        /* Song Info */
        .song-info {
            margin-bottom: 20px;
        }

        .song-title {
            font-size: 1.35rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .artist-name {
            font-size: 0.9rem;
            color: #ffd700;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            height: 6px;
            cursor: pointer;
            margin-bottom: 8px;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ffd700, #ff8c00);
            border-radius: 10px;
            transition: width 0.1s linear;
        }

        .time-stamps {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #b0b0b0;
            margin-bottom: 22px;
        }

        /* Music Controls */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
        }

        .btn {
            background: none;
            border: none;
            color: #d4af37;
            font-size: 1.3rem;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover {
            color: #ffffff;
            background: rgba(255, 215, 0, 0.15);
            transform: scale(1.1);
        }

        .btn-play {
            width: 60px;
            height: 60px;
            font-size: 1.6rem;
            background: linear-gradient(135deg, #ffd700 0%, #d4af37 100%);
            color: #000000;
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
        }

        .btn-play:hover {
            background: linear-gradient(135deg, #ffe033 0%, #e6be2e 100%);
            color: #000000;
            transform: scale(1.08);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.6);
        }

        /* Mobile Responsive */
        @media (max-width: 500px) {
            .container {
                padding: 25px 18px;
            }
            .header-title {
                font-size: 1.8rem;
            }
            .subtitle {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Main Title Header -->
        <h1 class="header-title">इमरान हाशमी</h1>
        <div class="subtitle">Golden 2000s Era</div>

        <!-- Middle Images Section -->
        <div class="images-section">
            <img src="1000644308.png" alt="Emraan Hashmi Top" class="img-top">
            <img src="1000644320.png" alt="Emraan Hashmi Bottom" class="img-bottom">
        </div>

        <!-- Song Title & Artist -->
        <div class="song-info">
            <div class="song-title" id="song-title">Zara Sa</div>
            <div class="artist-name" id="artist-name">Emraan Hashmi • KK</div>
        </div>

        <!-- Progress Bar & Duration -->
        <div class="progress-container" id="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="time-stamps">
            <span id="current-time">0:00</span>
            <span id="total-duration">0:00</span>
        </div>

        <!-- Music Player Controls -->
        <div class="controls">
            <button class="btn" id="prev-btn" title="Previous Song">
                <i class="fa-solid fa-backward-step"></i>
            </button>
            <button class="btn btn-play" id="play-btn" title="Play/Pause">
                <i class="fa-solid fa-play" id="play-icon"></i>
            </button>
            <button class="btn" id="next-btn" title="Next Song">
                <i class="fa-solid fa-forward-step"></i>
            </button>
        </div>
    </div>

    <!-- Audio Element -->
    <audio id="audio-player" src="ZaraSa.mp3"></audio>

    <script>
        // Playlist Data
        const playlist = [
            {
                title: "Zara Sa",
                artist: "Emraan Hashmi • KK (Jannat)",
                src: "ZaraSa.mp3"
            },
            {
                title: "Dil Ibaadat",
                artist: "Emraan Hashmi • KK (Tum Mile)",
                src: "Dil-Ibaadat.mp3"
            }
        ];

        let currentTrackIndex = 0;
        let isPlaying = false;

        // DOM Elements
        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const songTitle = document.getElementById('song-title');
        const artistName = document.getElementById('artist-name');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const currentTimeEl = document.getElementById('current-time');
        const totalDurationEl = document.getElementById('total-duration');

        // Load Track Function
        function loadTrack(index) {
            const track = playlist[index];
            songTitle.textContent = track.title;
            artistName.textContent = track.artist;
            audio.src = track.src;
            progressBar.style.width = '0%';
            currentTimeEl.textContent = '0:00';
            totalDurationEl.textContent = '0:00';
        }

        // Play Track
        function playTrack() {
            isPlaying = true;
            audio.play();
            playIcon.classList.remove('fa-play');
            playIcon.classList.add('fa-pause');
        }

        // Pause Track
        function pauseTrack() {
            isPlaying = false;
            audio.pause();
            playIcon.classList.remove('fa-pause');
            playIcon.classList.add('fa-play');
        }

        // Toggle Play/Pause
        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                pauseTrack();
            } else {
                playTrack();
            }
        });

        // Previous Track
        prevBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrackIndex);
            playTrack();
        });

        // Next Track
        nextBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            playTrack();
        });

        // Update Progress Bar & Time Stamps
        audio.addEventListener('timeupdate', (e) => {
            const { currentTime, duration } = e.target;
            if (duration) {
                const progressPercent = (currentTime / duration) * 100;
                progressBar.style.width = `${progressPercent}%`;

                // Calculate Current Time
                const currentMinutes = Math.floor(currentTime / 60);
                const currentSeconds = Math.floor(currentTime % 60);
                currentTimeEl.textContent = `${currentMinutes}:${currentSeconds < 10 ? '0' : ''}${currentSeconds}`;

                // Calculate Total Duration
                const durationMinutes = Math.floor(duration / 60);
                const durationSeconds = Math.floor(duration % 60);
                totalDurationEl.textContent = `${durationMinutes}:${durationSeconds < 10 ? '0' : ''}${durationSeconds}`;
            }
        });

        // Seek Audio
        progressContainer.addEventListener('click', (e) => {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            if (duration) {
                audio.currentTime = (clickX / width) * duration;
            }
        });

        // Auto Next on Song End
        audio.addEventListener('ended', () => {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            playTrack();
        });

        // Initial Load
        loadTrack(currentTrackIndex);
    </script>
</body>
</html>
