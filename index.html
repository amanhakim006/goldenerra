<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>इमरान हाशमी - Golden 2000s Era</title>
    <!-- Google Fonts for typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Rozha+One&family=Yatra+One&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Background image updated to eh.png */
            background: #0d0d0d url('eh.png') no-repeat center center fixed;
            background-size: cover;
            position: relative;
            color: #ffffff;
            overflow-x: hidden;
            padding: 20px;
        }

        /* Dark overlay for vintage feel and text readability */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.75) 0%, rgba(15, 10, 25, 0.85) 100%);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 900px;
            background: rgba(18, 18, 24, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.25);
            border-radius: 20px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 180, 0, 0.15);
        }

        /* Main Title Styling */
        .main-title {
            font-family: 'Rozha One', 'Yatra One', serif;
            font-size: 2.8rem;
            background: linear-gradient(180deg, #fff2a3 0%, #ffd700 50%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            margin-bottom: 8px;
            letter-spacing: 1px;
            line-height: 1.3;
        }

        .subtitle {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            color: #e0d0b0;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 30px;
            font-weight: 600;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        .divider {
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #ffd700, transparent);
            margin: 0 auto 30px auto;
        }

        /* Video Player Wrapper (Responsive 16:9 Aspect Ratio) */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 ratio */
            height: 0;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
            border: 2px solid rgba(255, 215, 0, 0.3);
            background: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .main-title {
                font-size: 2rem;
            }
            .subtitle {
                font-size: 1rem;
                letter-spacing: 2px;
            }
            .container {
                padding: 25px 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Title & Subtitle -->
        <h1 class="main-title">इमरान हाशमी</h1>
        <div class="subtitle">Golden 2000s Era</div>
        
        <div class="divider"></div>

        <!-- YouTube Video Embed -->
        <div class="video-wrapper">
            <iframe 
                src="https://www.youtube.com/embed/-8C_2BBVWk8?si=NaYUCjjiW4yp4iD6" 
                title="YouTube video player" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                referrerpolicy="strict-origin-when-cross-origin" 
                allowfullscreen>
            </iframe>
        </div>
    </div>

</body>
</html>
