<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden 2000s Era - Player</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome for Player Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background: #0d0d0d url('eh.png') no-repeat center center fixed;
            background-size: cover;
            position: relative;
            color: #ffffff;
            padding: 2vh 2vw 3vh 2vw;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.15);
            z-index: 1;
        }

        /* Title Image Section */
        .images-section {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 1vh;
            width: 100%;
        }

        .img-top {
            width: 100%;
            max-width: 480px;
            height: auto;
            border: none;
            box-shadow: none;
            display: block;
            object-fit: contain;
            filter: drop-shadow(0px 8px 18px rgba(0, 0, 0, 0.75));
        }

        /* Wide, Low-Height, Glassmorphic Music Player Box */
        .player-box {
            position: relative;
            z-index: 3;
            width: 90%;
            max-width: 680px; /* Length Increase */
            background: rgba(10, 10, 16, 0.45); /* Transparent Background */
            backdrop-filter: blur(20px); /* Enhanced Glass Blur */
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 50px; /* Pill Shape */
            padding: 8px 24px; /* Reduced Height (Low Padding) */
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 0, 0, 0.5); /* Ambient Shadow */
            margin-bottom: 2vh;
        }

        /* Compact Horizontal Song Info */
        .song-info {
            min-width: 130px;
            text-align: left;
            flex-shrink: 0;
        }

        .song-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.2;
            white-space: nowrap;
        }

        .artist-name {
            font-size: 0.72rem;
            color: #ffd700;
            font-weight: 300;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        /* Middle Progress Bar Container */
        .progress-wrapper {
            flex-grow: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .progress-container {
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            height: 4px;
            cursor: pointer;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ffd700, #ff8c00);
            border-radius: 10px;
            transition: width 0.1s linear;
        }

        .time-stamp {
            font-size: 0.68rem;
            color: #cccccc;
            min-width: 32px;
            text-align: center;
        }

        /* Compact Controls */
        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .btn {
            background: none;
            border: none;
            color: #d4af37;
            font-size: 0.95rem;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover {
            color: #ffffff;
            background: rgba(255, 215, 0, 0.15);
            transform: scale(1.1);
        }

        .btn-play {
            width: 38px;
            height: 38px;
            font-size: 1rem;
            background: linear-gradient(135deg, #ffd700 0%, #d4af37 100%);
            color: #000000;
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.35);
        }

        .btn-play:hover {
            background: linear-gradient(135deg, #ffe033 0%, #e6be2e 100%);
            color: #000000;
            transform: scale(1.08);
            box-shadow: 0 6px 18px rgba(255, 215, 0, 0.5);
        }

        /* Responsive Tweaks */
        @media (max-width: 600px) {
            .player-box {
                width: 95%;
                padding: 10px 16px;
                flex-wrap: wrap;
                border-radius: 20px;
                gap: 10px;
            }
            .song-info {
                width: 100%;
                text-align: center;
            }
            .progress-wrapper {
                width: 100%;
            }
            .controls {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- Title Image -->
    <div class="images-section">
        <img src="1000644342.png" alt="Emraan Hashmi Title PNG" class="img-top">
    </div>

    <!-- Wide, Sleek & Transparent Music Player Box at Bottom -->
    <div class="player-box">
        <!-- Song Title & Artist -->
        <div class="song-info">
            <div class="song-title" id="song-title">Zara Sa</div>
            <div class="artist-name" id="artist-name">Emraan Hashmi • KK</div>
        </div>

        <!-- Progress Bar & Timers in One Row -->
        <div class="progress-wrapper">
            <span class="time-stamp" id="current-time">0:00</span>
            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <span class="time-stamp" id="total-duration">0:00</span>
        </div>

        <!-- Music Player Controls -->
        <div class="controls">
            <button class="btn" id="prev-btn" title="Previous Song">
                <i class="fa-solid fa-backward-step"></i>
            </button>
            <button class="btn btn-play" id="play-btn" title="Play/Pause">
                <i class="fa-solid fa-play" id="play-icon"></i>
            </button>
            <button class="btn" id="next-btn" title="Next Song">
                <i class="fa-solid fa-forward-step"></i>
            </button>
        </div>
    </div>

    <!-- Audio Element -->
    <audio id="audio-player" src="ZaraSa.mp3"></audio>

    <script>
        // Playlist Data
        const playlist = [
            {
                title: "Zara Sa",
                artist: "Emraan Hashmi • KK (Jannat)",
                src: "ZaraSa.mp3"
            },
            {
                title: "Dil Ibaadat",
                artist: "Emraan Hashmi • KK (Tum Mile)",
                src: "Dil-Ibaadat.mp3"
            },
            {
                title: "Haan Tu Hain",
                artist: "Emraan Hashmi • KK (Jannat)",
                src: "HaanTuHain.mp3"
            },
            {
                title: "Tu Hi Haqeeqat",
                artist: "Emraan Hashmi • Javed Ali (Tum Mile)",
                src: "TuHiHaqeeqat.mp3"
            }
        ];

        let currentTrackIndex = 0;
        let isPlaying = false;

        // DOM Elements
        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const songTitle = document.getElementById('song-title');
        const artistName = document.getElementById('artist-name');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const currentTimeEl = document.getElementById('current-time');
        const totalDurationEl = document.getElementById('total-duration');

        // Load Track Function
        function loadTrack(index) {
            const track = playlist[index];
            songTitle.textContent = track.title;
            artistName.textContent = track.artist;
            audio.src = track.src;
            progressBar.style.width = '0%';
            currentTimeEl.textContent = '0:00';
            totalDurationEl.textContent = '0:00';
        }

        // Play Track
        function playTrack() {
            isPlaying = true;
            audio.play();
            playIcon.classList.remove('fa-play');
            playIcon.classList.add('fa-pause');
        }

        // Pause Track
        function pauseTrack() {
            isPlaying = false;
            audio.pause();
            playIcon.classList.remove('fa-pause');
            playIcon.classList.add('fa-play');
        }

        // Toggle Play/Pause
        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                pauseTrack();
            } else {
                playTrack();
            }
        });

        // Previous Track
        prevBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrackIndex);
            playTrack();
        });

        // Next Track
        nextBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            playTrack();
        });

        // Update Progress Bar & Time Stamps
        audio.addEventListener('timeupdate', (e) => {
            const { currentTime, duration } = e.target;
            if (duration) {
                const progressPercent = (currentTime / duration) * 100;
                progressBar.style.width = `${progressPercent}%`;

                // Calculate Current Time
                const currentMinutes = Math.floor(currentTime / 60);
                const currentSeconds = Math.floor(currentTime % 60);
                currentTimeEl.textContent = `${currentMinutes}:${currentSeconds < 10 ? '0' : ''}${currentSeconds}`;

                // Calculate Total Duration
                const durationMinutes = Math.floor(duration / 60);
                const durationSeconds = Math.floor(duration % 60);
                totalDurationEl.textContent = `${durationMinutes}:${durationSeconds < 10 ? '0' : ''}${durationSeconds}`;
            }
        });

        // Seek Audio
        progressContainer.addEventListener('click', (e) => {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            if (duration) {
                audio.currentTime = (clickX / width) * duration;
            }
        });

        // Auto Next on Song End
        audio.addEventListener('ended', () => {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            playTrack();
        });

        // Initial Load
        loadTrack(currentTrackIndex);
    </script>
</body>
</html>
