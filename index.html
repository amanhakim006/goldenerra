<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden 2000s Era - Player</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome for Player Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            /* Background image eh.png full visible */
            background: #0d0d0d url('eh.png') no-repeat center center fixed;
            background-size: cover;
            position: relative;
            color: #ffffff;
            overflow-x: hidden;
            padding: 10px 10px 20px 10px;
        }

        /* Light overlay for readability */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        /* Images Section (Enlarged, Zero Gap) */
        .images-section {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0px; /* Zero gap between images */
            margin-top: 5px;
            width: 100%;
        }

        .img-top {
            width: 100%;
            max-width: 520px; /* Bigger size */
            height: auto;
            border: none;
            box-shadow: none;
            display: block;
            object-fit: contain;
            filter: drop-shadow(0px 6px 14px rgba(0, 0, 0, 0.6));
        }

        .img-bottom {
            width: 100%;
            max-width: 580px; /* Bigger size */
            height: auto;
            border: none;
            box-shadow: none;
            display: block;
            margin-top: 0px; /* Seamless fit right below the top image */
            object-fit: contain;
            filter: drop-shadow(0px 6px 14px rgba(0, 0, 0, 0.6));
        }

        /* Ultra Compact Music Player Box */
        .player-box {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 320px; /* Smaller, compact width */
            background: rgba(12, 12, 18, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 215, 0, 0.25);
            border-radius: 16px;
            padding: 12px 16px; /* Compact padding */
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85), 0 0 12px rgba(255, 215, 0, 0.12);
            margin-top: 15px;
        }

        /* Compact Song Info */
        .song-info {
            margin-bottom: 8px;
        }

        .song-title {
            font-size: 0.98rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 1px;
            line-height: 1.2;
        }

        .artist-name {
            font-size: 0.75rem;
            color: #ffd700;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        /* Compact Progress Bar */
        .progress-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            height: 4px;
            cursor: pointer;
            margin-bottom: 4px;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ffd700, #ff8c00);
            border-radius: 10px;
            transition: width 0.1s linear;
        }

        .time-stamps {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: #b3b3b3;
            margin-bottom: 10px;
        }

        /* Compact Music Controls */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
        }

        .btn {
            background: none;
            border: none;
            color: #d4af37;
            font-size: 1rem;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover {
            color: #ffffff;
            background: rgba(255, 215, 0, 0.15);
            transform: scale(1.1);
        }

        .btn-play {
            width: 42px;
            height: 42px;
            font-size: 1.1rem;
            background: linear-gradient(135deg, #ffd700 0%, #d4af37 100%);
            color: #000000;
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.35);
        }

        .btn-play:hover {
            background: linear-gradient(135deg, #ffe033 0%, #e6be2e 100%);
            color: #000000;
            transform: scale(1.08);
            box-shadow: 0 6px 18px rgba(255, 215, 0, 0.5);
        }

        /* Mobile Tweaks */
        @media (max-width: 480px) {
            .player-box {
                max-width: 290px;
                padding: 10px 14px;
            }
            .img-top {
                max-width: 95%;
            }
            .img-bottom {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Middle Top Images (Enlarged & Zero Gap) -->
    <div class="images-section">
        <img src="1000644308.png" alt="Emraan Hashmi Top PNG" class="img-top">
        <img src="1000644320.png" alt="Emraan Hashmi Bottom PNG" class="img-top">
    </div>

    <!-- Ultra Compact Music Player Box at Bottom -->
    <div class="player-box">
        <!-- Song Title & Artist -->
        <div class="song-info">
            <div class="song-title" id="song-title">Zara Sa</div>
            <div class="artist-name" id="artist-name">Emraan Hashmi • KK</div>
        </div>

        <!-- Progress Bar & Duration -->
        <div class="progress-container" id="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="time-stamps">
            <span id="current-time">0:00</span>
            <span id="total-duration">0:00</span>
        </div>

        <!-- Music Player Controls -->
        <div class="controls">
            <button class="btn" id="prev-btn" title="Previous Song">
                <i class="fa-solid fa-backward-step"></i>
            </button>
            <button class="btn btn-play" id="play-btn" title="Play/Pause">
                <i class="fa-solid fa-play" id="play-icon"></i>
            </button>
            <button class="btn" id="next-btn" title="Next Song">
                <i class="fa-solid fa-forward-step"></i>
            </button>
        </div>
    </div>

    <!-- Audio Element -->
    <audio id="audio-player" src="ZaraSa.mp3"></audio>

    <script>
        // Playlist Data
        const playlist = [
            {
                title: "Zara Sa",
                artist: "Emraan Hashmi • KK (Jannat)",
                src: "ZaraSa.mp3"
            },
            {
                title: "Dil Ibaadat",
                artist: "Emraan Hashmi • KK (Tum Mile)",
                src: "Dil-Ibaadat.mp3"
            }
        ];

        let currentTrackIndex = 0;
        let isPlaying = false;

        // DOM Elements
        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const songTitle = document.getElementById('song-title');
        const artistName = document.getElementById('artist-name');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const currentTimeEl = document.getElementById('current-time');
        const totalDurationEl = document.getElementById('total-duration');

        // Load Track Function
        function loadTrack(index) {
            const track = playlist[index];
            songTitle.textContent = track.title;
            artistName.textContent = track.artist;
            audio.src = track.src;
            progressBar.style.width = '0%';
            currentTimeEl.textContent = '0:00';
            totalDurationEl.textContent = '0:00';
        }

        // Play Track
        function playTrack() {
            isPlaying = true;
            audio.play();
            playIcon.classList.remove('fa-play');
            playIcon.classList.add('fa-pause');
        }

        // Pause Track
        function pauseTrack() {
            isPlaying = false;
            audio.pause();
            playIcon.classList.remove('fa-pause');
            playIcon.classList.add('fa-play');
        }

        // Toggle Play/Pause
        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                pauseTrack();
            } else {
                playTrack();
            }
        });

        // Previous Track
        prevBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrackIndex);
            playTrack();
        });

        // Next Track
        nextBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            playTrack();
        });

        // Update Progress Bar & Time Stamps
        audio.addEventListener('timeupdate', (e) => {
            const { currentTime, duration } = e.target;
            if (duration) {
                const progressPercent = (currentTime / duration) * 100;
                progressBar.style.width = `${progressPercent}%`;

                // Calculate Current Time
                const currentMinutes = Math.floor(currentTime / 60);
                const currentSeconds = Math.floor(currentTime % 60);
                currentTimeEl.textContent = `${currentMinutes}:${currentSeconds < 10 ? '0' : ''}${currentSeconds}`;

                // Calculate Total Duration
                const durationMinutes = Math.floor(duration / 60);
                const durationSeconds = Math.floor(duration % 60);
                totalDurationEl.textContent = `${durationMinutes}:${durationSeconds < 10 ? '0' : ''}${durationSeconds}`;
            }
        });

        // Seek Audio
        progressContainer.addEventListener('click', (e) => {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            if (duration) {
                audio.currentTime = (clickX / width) * duration;
            }
        });

        // Auto Next on Song End
        audio.addEventListener('ended', () => {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            playTrack();
        });

        // Initial Load
        loadTrack(currentTrackIndex);
    </script>
</body>
</html>
